<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <style>
        table,
        tr,
        th,
        td {
            border: 1px solid black;
            border-collapse: collapse;
            padding: 8px;
        }

        td {
            background-color: aquamarine;
        }

        th {
            background-color: orange;
        }
    </style>
</head>

<body>
    <center>
        <h1>Calculator</h1>
        <table>
            <tr>
                <th style="text-align:right ;">0</th>
            </tr>
            <tr>
                <td>%</td>
                <td>CE</td>
                <td>C</td>
                <td>&lt;=</td>
            </tr>
            <tr>
                <td>7</td>
                <td>8</td>
                <td>9</td>
                <td>x</td>
            </tr>
            <tr>
                <td>4</td>
                <td>5</td>
                <td>6</td>
                <td>-</td>
            </tr>
            <tr>
                <td>1</td>
                <td>2</td>
                <td>3</td>
                <td>+</td>
            </tr>
            <tr>
                <td><sup>x</sup>/<sub>-</sub></td>
                <td>0</td>
                <td>.</td>
                <td>=</td>
            </tr>



        </table>
    </center>
</body>

</html>
